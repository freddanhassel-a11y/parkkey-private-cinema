<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ParkKey Private Cinema</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;font:clamp(17px,2vw,27px) system-ui,Arial;background:radial-gradient(ellipse at 80% 10%,#086d78 0,transparent 45%),radial-gradient(ellipse at 10% 100%,#12446b 0,transparent 50%),#071322;color:#f5fff9;min-height:100vh}main{padding:5vh 6vw}header{display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{font-size:clamp(26px,4vw,52px);font-weight:850;letter-spacing:-.05em}.brand span{color:#52ed84}.clock{font-variant-numeric:tabular-nums;font-size:clamp(22px,3vw,42px)}h1{font-size:clamp(38px,6vw,92px);line-height:1.04;letter-spacing:-.055em;margin:10vh 0 12px}p{color:#b8d5d1;margin:0 0 5vh}.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.tile{min-height:125px;border:1px solid #ffffff30;border-radius:22px;background:#ffffff12;backdrop-filter:blur(16px);display:flex;align-items:center;justify-content:center;text-decoration:none;color:white;font-size:clamp(19px,2.5vw,35px);font-weight:750;transition:transform .15s,background .15s}.tile:focus,.tile:hover{outline:4px solid #69f49b;outline-offset:3px;background:#ffffff2b;transform:scale(1.02)}footer{margin-top:5vh;font-size:15px;color:#b8d5d1}@media(max-width:650px){.tiles{grid-template-columns:repeat(2,1fr)}.tile{min-height:100px}h1{margin-top:7vh}}</style></head><body><main><header><div class="brand"><span>◉</span> PARKKEY™ <small style="font-size:.35em;letter-spacing:.08em;display:block;color:#9ccbb9">PRIVATE CINEMA</small></div><div class="clock" id="clock"></div></header><h1>Din filmkväll.<br><span style="color:#65ed96">Din upplevelse.</span></h1><p>Välj din streamingtjänst med fjärrkontrollen.</p><nav class="tiles" aria-label="Streaming"><a class="tile" href="https://www.youtube.com/tv">YouTube</a><a class="tile" href="https://www.netflix.com/">Netflix</a><a class="tile" href="https://www.disneyplus.com/">Disney+</a><a class="tile" href="https://www.primevideo.com/">Prime Video</a><a class="tile" href="https://www.svtplay.se/">SVT Play</a><a class="tile" href="https://arenan.yle.fi/">Yle Arenan</a></nav><footer>Privat TV-startsida • Webblänkar kan kräva respektive Android TV-app • Ingen CoreOS-anslutning</footer></main><script>const c=document.getElementById('clock');function tick(){c.textContent=new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Mariehamn',hour:'2-digit',minute:'2-digit'}).format(new Date())}tick();setInterval(tick,15000);document.addEventListener('keydown',e=>{let a=[...document.querySelectorAll('.tile')],i=a.indexOf(document.activeElement);if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();let n=i<0?0:Math.max(0,Math.min(a.length-1,i+(e.key==='ArrowLeft'?-1:e.key==='ArrowRight'?1:e.key==='ArrowUp'?-3:3)));a[n].focus()})</script></body></html>
